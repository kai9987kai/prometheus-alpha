name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: unit tests (engine invariants, JS/Python parity, statistics)
        run: python -m pytest -q
      - name: the preregistration lock still verifies
        run: prometheus prereg verify
      - name: every number in the README is checked against the results files
        run: prometheus claims check
