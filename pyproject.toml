[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-alpha"
version = "0.7.0"
description = "Memory that outlives its organ: a preregistered laboratory of regenerating worms that learn"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kai Piper"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
prometheus = "prometheus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
